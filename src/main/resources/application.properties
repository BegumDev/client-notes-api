# PostgreSQL JDBC & Flyway
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# Production Postgres connection (overridden via env vars in Docker Compose)
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://db:5432/clientnotes}
%prod.quarkus.datasource.username=${DB_USER:notesuser}
%prod.quarkus.datasource.password=${DB_PASSWORD:notespass}

# Dev & Test PostgreSQL container image (Testcontainers)
quarkus.datasource.devservices.image-name=docker.io/postgres:16-alpine

# Observability
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics

# Expose Swagger UI & OpenAPI schema in production container
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
