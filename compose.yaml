services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clientnotes
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: notespass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesuser -d clientnotes"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - notes-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: begumdev/client-notes-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      QUARKUS_PROFILE: prod
      DB_URL: jdbc:postgresql://db:5432/clientnotes
      DB_USER: notesuser
      DB_PASSWORD: notespass
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notes-net

volumes:
  pgdata:

networks:
  notes-net:
    driver: bridge
